name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    lint-and-test:
        name: Lint and Test
        runs-on: ubuntu-latest
        outputs:
            scenarios: ${{ steps.scenarios.outputs.list }}
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Format check
              run: |
                  if [ -n "$(gofmt -l .)" ]; then
                      echo "Go code is not formatted. Run 'gofmt -w .' to fix:"
                      gofmt -d .
                      exit 1
                  fi

            - name: Install golangci-lint
              run: |
                  # Installer fetched from the pinned tag, not master: the script itself is
                  # then immutable, and it sha256-verifies the binary it downloads.
                  curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.12.2
                  echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

            - name: Lint Go code
              run: golangci-lint run --timeout=5m

            - name: Run tests
              run: go test -v ./...

            - name: Build radar
              run: CGO_ENABLED=0 go build -ldflags="-s -w" -o radar .

            - name: Upload Linux binary
              uses: actions/upload-artifact@v4
              with:
                  name: radar-linux
                  path: radar
                  retention-days: 1

            - name: List integration test scenarios
              id: scenarios
              shell: bash
              run: |
                  list=$(./test-radar.sh --list | jq -cnR '[inputs]')
                  if [ "$list" = "[]" ]; then
                      echo "test-radar.sh --list printed no scenarios" >&2
                      exit 1
                  fi
                  echo "list=$list" >> "$GITHUB_OUTPUT"

    integration-test:
        name: Integration Test - Scenario ${{ matrix.scenario }}
        runs-on: ubuntu-latest
        needs: lint-and-test
        strategy:
            matrix:
                scenario: ${{ fromJSON(needs.lint-and-test.outputs.scenarios) }}
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Download Linux binary
              uses: actions/download-artifact@v4
              with:
                  name: radar-linux

            - name: Make binary executable
              run: chmod +x radar

            # The committed Dockerfile and test-radar.sh, exactly as
            # run-ci-local.sh runs them: one container per scenario.
            - name: Build Docker image
              run: docker build -t radar-local-test .

            - name: Run integration test container
              env:
                  SCENARIO: ${{ matrix.scenario }}
              run: docker run --rm radar-local-test ./test-radar.sh "$SCENARIO"

            - name: Clean up Docker images
              if: always()
              run: docker rmi radar-local-test || true

    macos-test:
        name: macOS Build and Test
        runs-on: macos-latest
        needs: lint-and-test
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Install PostgreSQL
              run: |
                  brew install postgresql@18
                  echo "/opt/homebrew/opt/postgresql@18/bin" >> $GITHUB_PATH
                  brew services start postgresql@18

            - name: Install pg_statviz extension
              run: |
                  git clone https://github.com/vyruss/pg_statviz.git /tmp/pg_statviz
                  cd /tmp/pg_statviz
                  make install PG_CONFIG=/opt/homebrew/opt/postgresql@18/bin/pg_config

            - name: Wait for PostgreSQL to be ready
              run: |
                  for i in {1..30}; do
                      if /opt/homebrew/opt/postgresql@18/bin/pg_isready -h localhost; then
                          echo "PostgreSQL is ready"
                          break
                      fi
                      echo "Waiting for PostgreSQL... ($i/30)"
                      sleep 1
                  done

            - name: Build radar for macOS
              run: CGO_ENABLED=0 go build -ldflags="-s -w" -o radar .

            - name: Create test database
              run: |
                  /opt/homebrew/opt/postgresql@18/bin/createdb testdb
                  /opt/homebrew/opt/postgresql@18/bin/psql -d testdb -c "CREATE EXTENSION IF NOT EXISTS pg_statviz;"
                  /opt/homebrew/opt/postgresql@18/bin/psql -d testdb -c "SELECT pgstatviz.snapshot();"

            - name: Run radar collection
              run: ./radar -d testdb -v

            - name: Verify output
              run: |
                  ZIPFILE=$(ls radar-*.zip 2>/dev/null | head -1)
                  if [ -z "$ZIPFILE" ]; then
                      echo "ERROR: No radar output file found"
                      ls -la
                      exit 1
                  fi
                  echo "Found output file: $ZIPFILE"
                  unzip -l "$ZIPFILE" | head -50

                  # Verify PostgreSQL data collected
                  if ! unzip -l "$ZIPFILE" | grep -q "postgresql/version.tsv"; then
                      echo "ERROR: Missing PostgreSQL data"
                      exit 1
                  fi
                  echo "✓ PostgreSQL data found"

                  # Verify system data collected
                  if ! unzip -l "$ZIPFILE" | grep -q "system/"; then
                      echo "ERROR: Missing system data"
                      exit 1
                  fi
                  echo "✓ System data found"

                  # Check for empty files
                  EMPTY_COUNT=$(unzip -l "$ZIPFILE" | awk '$1 == 0 {count++} END {print count+0}')
                  if [ "$EMPTY_COUNT" -gt 0 ]; then
                      echo "ERROR: Found $EMPTY_COUNT empty files in archive"
                      unzip -l "$ZIPFILE" | awk '$1 == 0'
                      exit 1
                  fi
                  echo "✓ No empty files found"
                  echo "=== macOS test PASSED ==="
