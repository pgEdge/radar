version: "2"

run:
    tests: true

linters:
    enable:
        - errcheck
        - govet
        - ineffassign
        - staticcheck
        - unused

formatters:
    enable:
        - gofmt
    settings:
        gofmt:
            simplify: true

issues:
    max-issues-per-linter: 0
    max-same-issues: 0
